<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Zeus Scientific Calculator | Zewpol Store</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* avoid accidental selection on double-tap */
    }

    body {
      background: linear-gradient(145deg, #101418 0%, #1b212c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, 'Roboto', 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* main calculator card */
    .calc-container {
      max-width: 580px;
      width: 100%;
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(2px);
      border-radius: 52px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.08);
      padding: 24px 20px 28px;
      transition: all 0.2s;
    }

    /* display area */
    .display-wrap {
      background: #0a0c12;
      border-radius: 38px;
      padding: 18px 24px;
      margin-bottom: 28px;
      box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .expression {
      font-size: 1.45rem;
      font-weight: 400;
      color: #9aa4bf;
      min-height: 2.5rem;
      word-break: break-word;
      font-family: 'Fira Mono', 'Cascadia Code', monospace;
      letter-spacing: 0.3px;
      text-align: right;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .result {
      font-size: 2.7rem;
      font-weight: 600;
      color: #f0f3ff;
      text-align: right;
      word-break: break-word;
      font-family: 'Fira Mono', monospace;
      margin-top: 8px;
      letter-spacing: 1px;
      min-height: 4rem;
      border-top: 1px solid #2a2f3e;
      padding-top: 12px;
    }

    /* button grid */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    button {
      background: #1e2436;
      border: none;
      border-radius: 28px;
      padding: 16px 0;
      font-size: 1.35rem;
      font-weight: 500;
      font-family: inherit;
      color: #eef2ff;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 5px 0 #0b0e14;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0b0e14;
    }

    /* special button styles */
    .btn-func {
      background: #2a3149;
      color: #b9e2ff;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn-op {
      background: #f3a712;
      color: #1f1b14;
      font-weight: 700;
      font-size: 1.6rem;
      box-shadow: 0 5px 0 #b4621a;
    }

    .btn-equal {
      background: #2b9c5c;
      color: white;
      font-size: 1.7rem;
      font-weight: bold;
      box-shadow: 0 5px 0 #166b3e;
    }

    .btn-clear {
      background: #c44536;
      color: white;
      box-shadow: 0 5px 0 #892e22;
    }

    .btn-sci {
      background: #3c2f5f;
      font-size: 1rem;
    }

    /* responsive */
    @media (max-width: 520px) {
      .calc-container {
        padding: 16px;
      }
      .buttons-grid {
        gap: 10px;
      }
      button {
        padding: 12px 0;
        font-size: 1.1rem;
      }
      .result {
        font-size: 2rem;
      }
      .expression {
        font-size: 1.1rem;
      }
      .btn-op {
        font-size: 1.4rem;
      }
    }

    footer {
      text-align: center;
      font-size: 0.7rem;
      color: #6a6f87;
      margin-top: 24px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<div class="calc-container">
  <div class="display-wrap">
    <div class="expression" id="expressionDisplay">0</div>
    <div class="result" id="resultDisplay">= 0</div>
  </div>

  <div class="buttons-grid" id="buttonPanel">
    <!-- Buttons will be generated by JS, but I keep static HTML structure for clarity? 
    but we need dynamic. Better to generate with JS for maintainability -->
  </div>
  <footer>⚡ ZEWPOL SCIENTIFIC | trig, log, sqrt, π, e, constants | degree/rad toggle</footer>
</div>

<script>
  // --------------------------------------------------------------
  // SCIENTIFIC CALCULATOR ENGINE (safe eval with math.js style but custom)
  // Using JavaScript's Function constructor + pre-defined math context
  // We support: basic ops, math functions, constants, parentheses, power, etc.
  // All calculations happen in a sandboxed way.
  // --------------------------------------------------------------

  // ---- STATE ----
  let currentExpression = "";     // raw expression string as user builds
  let lastResult = null;          // last computed numeric result
  let radianMode = true;          // true = radian, false = degree
  let memoryValue = 0;            // simple memory M+/MR/MC
  
  // DOM elements
  const expressionDiv = document.getElementById("expressionDisplay");
  const resultDiv = document.getElementById("resultDisplay");

  // -------------------- HELPER: Update Display ------------------
  function updateDisplay() {
    // show expression; if empty show "0"
    if (currentExpression === "") {
      expressionDiv.innerText = "0";
    } else {
      expressionDiv.innerText = currentExpression;
    }
    // show last result preview if exists, else nothing
    if (lastResult !== null && lastResult !== undefined && !isNaN(lastResult) && isFinite(lastResult)) {
      // format nicely
      let formatted = typeof lastResult === 'number' ? parseFloat(lastResult.toFixed(10)) : lastResult;
      if (formatted.toString().length > 20) {
        formatted = lastResult.toExponential(10);
      }
      resultDiv.innerText = `= ${formatted}`;
    } else if (lastResult === null) {
      resultDiv.innerText = "= 0";
    } else {
      resultDiv.innerText = "= Error";
    }
  }

  // -------------------- SAFE EVALUATION ENGINE -----------------
  // We'll construct a function using the "math context" with all standard math functions.
  // Support: + - * / % **, functions: sin, cos, tan, asin, acos, atan, sinh, cosh, tanh, ln, log10, sqrt, abs, floor, ceil, round, exp, 
  // and constants: PI, E, and also degree conversion if needed.
  // We'll pre-process expression to convert degree-trig if deg mode is active.
  
  // returns calculated number or throws error
  function evaluateExpression(expr) {
    if (!expr.trim()) return 0;
    
    // 1. Replace ^ with ** for power (convenience)
    let processed = expr.replace(/\^/g, '**');
    
    // 2. handle constants: π -> PI, e -> E (case-insensitive but we match)
    processed = processed.replace(/π/g, 'PI').replace(/e\b/g, 'E');
    // also handle pi, Pi
    processed = processed.replace(/pi\b/gi, 'PI');
    
    // 3. degree/radian conversion: if NOT radian mode, we need to wrap trig arguments with deg->rad conversion.
    // We'll identify sin( , cos( , tan( , and convert inner degrees.
    // But careful: nested parentheses etc. Use regex to replace function calls? Better: Pre-process carefully: 
    // A robust way: walk through but for calculator, we can handle in a single regex that wraps numbers inside trig functions.
    // However for general expressions we use a simple but effective technique: if degree mode is active, we replace sin( with sin( (argument * PI/180) ).
    // But argument may be any expression. So we do a global replace using a function that finds the argument between parentheses.
    // Complex but safer: We'll create a wrapper that uses a custom evaluator? Alternative: dynamically substitute before eval.
    // Use regex that captures sin( ... ) where ... is anything with balanced parentheses, but limited depth.
    // Simpler approach: Use an iterative replacement for trig functions limited depth 5, good for typical calculator.
    if (!radianMode) {
      // apply degree conversion for trig functions: sin, cos, tan, also asin/acos/atan? Inverse trig in degree mode would return degrees?
      // For inverse trig we would need to convert output as well, but typical calculator degree mode: input degrees to sin/cos/tan; output from arcsin etc in degrees.
      // For arcs, we must convert from radian result to degrees. To support, we need to detect asin etc and convert.
      // We'll process both: sin/cos/tan multiply argument by (π/180), and asin/acos/atan multiply result by (180/π)
      // simple approach: replace function calls in safe manner.
      
      // forward trig (input degrees)
      const forwardTrig = ['sin', 'cos', 'tan'];
      for (let fn of forwardTrig) {
        const regex = new RegExp(`${fn}\\(([^)]+(?:\\([^)]*\\)[^)]*)*)\\)`, 'g');
        processed = processed.replace(regex, (match, inner) => {
          // recursively process inner to avoid missing nested
          return `${fn}(${inner} * PI / 180)`;
        });
      }
      
      // inverse trig -> output degrees (radians * 180/PI)
      const inverseTrig = ['asin', 'acos', 'atan'];
      for (let fn of inverseTrig) {
        const regex = new RegExp(`${fn}\\(([^)]+(?:\\([^)]*\\)[^)]*)*)\\)`, 'g');
        processed = processed.replace(regex, (match, inner) => {
          return `(${fn}(${inner}) * 180 / PI)`;
        });
      }
    }
    
    // 4. add support for percentage: interpret 50% as 0.5? Better not ambiguous. But we support % as modulo operator + classic percentage?
    // We'll allow % as modulo (remainder) which is standard.
    
    // 5. also we want to support sqrt, ln, log10, abs, floor, ceil, round.
    // Math object already includes these.
    
    // Build allowed context object
    const mathContext = {
      PI: Math.PI,
      E: Math.E,
      sin: (x) => Math.sin(x),
      cos: (x) => Math.cos(x),
      tan: (x) => Math.tan(x),
      asin: (x) => Math.asin(x),
      acos: (x) => Math.acos(x),
      atan: (x) => Math.atan(x),
      sinh: (x) => Math.sinh(x),
      cosh: (x) => Math.cosh(x),
      tanh: (x) => Math.tanh(x),
      ln: (x) => Math.log(x),
      log10: (x) => Math.log10(x),
      sqrt: (x) => Math.sqrt(x),
      abs: (x) => Math.abs(x),
      floor: (x) => Math.floor(x),
      ceil: (x) => Math.ceil(x),
      round: (x) => Math.round(x),
      exp: (x) => Math.exp(x),
      // also add factorial custom! (advanced)
      fact: (n) => { if (n < 0) return NaN; if (Math.floor(n) !== n) return NaN; let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
    };
    
    // also allow binary operators and implicit multiplication? optional: handle 2sin(30) but normally we don't need, user will type *.
    
    // Use Function constructor to evaluate safely with arguments
    const keys = Object.keys(mathContext);
    const values = keys.map(k => mathContext[k]);
    
    // final safety: prevent infinite loops or assign globals
    let evaluator;
    try {
      evaluator = new Function(...keys, `'use strict'; return (${processed});`);
      const result = evaluator(...values);
      // validate numeric result
      if (typeof result !== 'number' || isNaN(result) || !isFinite(result)) {
        throw new Error("Invalid math result");
      }
      return result;
    } catch (err) {
      console.warn(err);
      throw new Error("Expression error");
    }
  }
  
  // evaluate and update state
  function computeExpression() {
    if (currentExpression.trim() === "") {
      lastResult = 0;
      updateDisplay();
      return;
    }
    try {
      const rawExpr = currentExpression;
      // replace modulo sign: % to % operator, but JS uses % for remainder, works fine.
      let exprToEval = rawExpr;
      // handle factorial manually before eval? we support fact(n) function. Also user can press n! using button, but we implement '!' as factorial
      // Replace trailing ! with fact(...). For example 5! -> fact(5). Also (5+2)! -> fact((5+2))
      exprToEval = exprToEval.replace(/(\d+(?:\.\d+)?|\))\!/g, (match, p1) => {
        return `fact(${p1})`;
      });
      // catch general parentheses factorial: e.g., (2+3)! -> fact((2+3))
      exprToEval = exprToEval.replace(/\)\!/g, ')', (m) => { }); // but already captured above. safer further:
      // additional factorial pattern for closing parentheses:
      exprToEval = exprToEval.replace(/\(([^()]*)\)\!/g, (match, inner) => `fact((${inner}))`);
      
      const result = evaluateExpression(exprToEval);
      lastResult = result;
      // optional: keep expression but also store last result for Ans
      updateDisplay();
    } catch (err) {
      lastResult = NaN;
      resultDiv.innerText = "= Syntax Error";
      expressionDiv.innerText = currentExpression || "0";
    }
  }
  
  // Helper: append token / char
  function appendToExpression(value) {
    // prevent multiple operators in a row? but better let user but we avoid errors: do basic cleaning
    if (currentExpression === "" && (value === '*' || value === '/' || value === '%' || value === '^' || value === ')' || value === '!')) {
      // avoid starting with operator except minus (negative)
      if (value !== '-' && value !== '(' && value !== '+' ) {
        return;
      }
    }
    // automatically replace previous '=' behavior? fresh start if needed? but we don't replace
    currentExpression += value;
    updateDisplay();
  }
  
  // clear all
  function clearAll() {
    currentExpression = "";
    lastResult = null;
    updateDisplay();
  }
  
  // backspace
  function backspace() {
    currentExpression = currentExpression.slice(0, -1);
    updateDisplay();
  }
  
  // use last answer
  function useAns() {
    if (lastResult !== null && !isNaN(lastResult) && isFinite(lastResult)) {
      const ansStr = lastResult.toString();
      appendToExpression(ansStr);
    } else {
      appendToExpression("0");
    }
  }
  
  // degree/radian toggle
  let degRadBtn;
  function toggleDegRad() {
    radianMode = !radianMode;
    // update button text later after rebuild? we will rebuild buttons dynamically to reflect.
    // we can re-render buttons or just update a specific button.
    if (degRadBtn) degRadBtn.innerText = radianMode ? "RAD" : "DEG";
    // re-evaluate current expression? not needed automatically, just mode changes future eval.
    // but if current expression contains trig, we could live update? optional: user should press equal again.
    // we can just show a small indicator, but no harm.
  }
  
  // memory functions
  let memory = 0;
  function memRecall() { if (memory !== undefined) appendToExpression(memory.toString()); }
  function memStore() { if (lastResult !== null && !isNaN(lastResult) && isFinite(lastResult)) memory = lastResult; else if (currentExpression) { try { let val = evaluateExpression(currentExpression.replace(/\^/g,'**').replace(/π/g,'PI').replace(/e\b/g,'E')); memory = val; } catch(e) {} } }
  function memClear() { memory = 0; }
  function memAdd() { if (lastResult !== null && !isNaN(lastResult) && isFinite(lastResult)) memory += lastResult; else if (currentExpression) { try { let val = evaluateExpression(currentExpression.replace(/\^/g,'**').replace(/π/g,'PI').replace(/e\b/g,'E')); memory += val; } catch(e) {} } }
  
  // Additional constants & function preset
  function insertConstant(val) { appendToExpression(val); }
  
  // ------------------- Build UI DYNAMICALLY (better layout)
  const buttonPanel = document.getElementById("buttonPanel");
  
  // define button layout: each obj: label, action, type (class)
  const buttons = [
    { label: "(", action: () => appendToExpression("("), class: "btn-func" },
    { label: ")", action: () => appendToExpression(")"), class: "btn-func" },
    { label: "C", action: () => clearAll(), class: "btn-clear" },
    { label: "⌫", action: () => backspace(), class: "btn-clear" },
    { label: "÷", action: () => appendToExpression("/"), class: "btn-op" },
    
    { label: "7", action: () => appendToExpression("7"), class: "" },
    { label: "8", action: () => appendToExpression("8"), class: "" },
    { label: "9", action: () => appendToExpression("9"), class: "" },
    { label: "×", action: () => appendToExpression("*"), class: "btn-op" },
    { label: "√", action: () => appendToExpression("sqrt("), class: "btn-func" },
    
    { label: "4", action: () => appendToExpression("4"), class: "" },
    { label: "5", action: () => appendToExpression("5"), class: "" },
    { label: "6", action: () => appendToExpression("6"), class: "" },
    { label: "-", action: () => appendToExpression("-"), class: "btn-op" },
    { label: "^", action: () => appendToExpression("^"), class: "btn-func" },
    
    { label: "1", action: () => appendToExpression("1"), class: "" },
    { label: "2", action: () => appendToExpression("2"), class: "" },
    { label: "3", action: () => appendToExpression("3"), class: "" },
    { label: "+", action: () => appendToExpression("+"), class: "btn-op" },
    { label: "%", action: () => appendToExpression("%"), class: "btn-func" },
    
    { label: "0", action: () => appendToExpression("0"), class: "" },
    { label: ".", action: () => appendToExpression("."), class: "" },
    { label: "π", action: () => appendToExpression("π"), class: "btn-sci" },
    { label: "e", action: () => appendToExpression("e"), class: "btn-sci" },
    { label: "=", action: () => computeExpression(), class: "btn-equal" },
    
    // second row functions more
    { label: "sin", action: () => appendToExpression("sin("), class: "btn-sci" },
    { label: "cos", action: () => appendToExpression("cos("), class: "btn-sci" },
    { label: "tan", action: () => appendToExpression("tan("), class: "btn-sci" },
    { label: "ln", action: () => appendToExpression("ln("), class: "btn-sci" },
    { label: "log", action: () => appendToExpression("log10("), class: "btn-sci" },
    
    { label: "asin", action: () => appendToExpression("asin("), class: "btn-sci" },
    { label: "acos", action: () => appendToExpression("acos("), class: "btn-sci" },
    { label: "atan", action: () => appendToExpression("atan("), class: "btn-sci" },
    { label: "sinh", action: () => appendToExpression("sinh("), class: "btn-sci" },
    { label: "cosh", action: () => appendToExpression("cosh("), class: "btn-sci" },
    
    { label: "tanh", action: () => appendToExpression("tanh("), class: "btn-sci" },
    { label: "abs", action: () => appendToExpression("abs("), class: "btn-sci" },
    { label: "floor", action: () => appendToExpression("floor("), class: "btn-sci" },
    { label: "ceil", action: () => appendToExpression("ceil("), class: "btn-sci" },
    { label: "!", action: () => appendToExpression("!"), class: "btn-func" },
    
    { label: "Ans", action: () => useAns(), class: "btn-func" },
    { label: "MR", action: () => memRecall(), class: "btn-func" },
    { label: "MS", action: () => memStore(), class: "btn-func" },
    { label: "M+", action: () => memAdd(), class: "btn-func" },
    { label: "MC", action: () => memClear(), class: "btn-func" },
    
    { label: "RAD/DEG", action: () => toggleDegRad(), class: "btn-sci", id: "degRadToggle" },
    { label: "exp", action: () => appendToExpression("exp("), class: "btn-sci" },
    { label: "x²", action: () => appendToExpression("^2"), class: "btn-func" },
    { label: "x³", action: () => appendToExpression("^3"), class: "btn-func" },
    { label: "1/x", action: () => appendToExpression("^(-1)"), class: "btn-func" }
  ];
  
  function buildUI() {
    buttonPanel.innerHTML = "";
    buttons.forEach(btn => {
      const buttonEl = document.createElement("button");
      buttonEl.innerText = btn.label;
      if (btn.class) buttonEl.className = btn.class;
      else buttonEl.className = "";
      if (btn.id) buttonEl.id = btn.id;
      buttonEl.addEventListener("click", (e) => {
        e.preventDefault();
        btn.action();
      });
      buttonPanel.appendChild(buttonEl);
    });
    degRadBtn = document.getElementById("degRadToggle");
    if (degRadBtn) degRadBtn.innerText = radianMode ? "RAD" : "DEG";
  }
  
  // initial render
  buildUI();
  clearAll(); // set initial state
  updateDisplay();
  
  // add keyboard support
  window.addEventListener('keydown', (e) => {
    const key = e.key;
    // digits & operators
    if (/[0-9\.\(\)\+\-\*\/\%]/.test(key)) {
      e.preventDefault();
      if (key === '*') appendToExpression('*');
      else if (key === '/') appendToExpression('/');
      else appendToExpression(key);
    } else if (key === 'Enter' || key === '=') {
      e.preventDefault();
      computeExpression();
    } else if (key === 'Escape') {
      clearAll();
    } else if (key === 'Backspace') {
      backspace();
    } else if (key === '^') {
      appendToExpression('^');
    } else if (key === '!') {
      appendToExpression('!');
    }
  });
</script>
</body>
</html>
