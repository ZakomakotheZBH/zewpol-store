<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Zeus Scientific Calculator | Zewpol Store</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: linear-gradient(145deg, #101418 0%, #1b212c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Inter', system-ui, 'Roboto', 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
    }

    .calc-container {
      max-width: 580px;
      width: 100%;
      background: rgba(18, 22, 32, 0.85);
      backdrop-filter: blur(2px);
      border-radius: 52px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.08);
      padding: 24px 20px 28px;
      transition: all 0.2s;
    }

    .display-wrap {
      background: #0a0c12;
      border-radius: 38px;
      padding: 18px 24px;
      margin-bottom: 28px;
      box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .expression {
      font-size: 1.45rem;
      font-weight: 400;
      color: #9aa4bf;
      min-height: 2.5rem;
      word-break: break-word;
      font-family: 'Fira Mono', 'Cascadia Code', monospace;
      letter-spacing: 0.3px;
      text-align: right;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .result {
      font-size: 2.7rem;
      font-weight: 600;
      color: #f0f3ff;
      text-align: right;
      word-break: break-word;
      font-family: 'Fira Mono', monospace;
      margin-top: 8px;
      min-height: 4rem;
      border-top: 1px solid #2a2f3e;
      padding-top: 12px;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    button {
      background: #1e2436;
      border: none;
      border-radius: 28px;
      padding: 16px 0;
      font-size: 1.35rem;
      font-weight: 500;
      font-family: inherit;
      color: #eef2ff;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 5px 0 #0b0e14;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0b0e14;
    }

    .btn-func {
      background: #2a3149;
      color: #b9e2ff;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn-op {
      background: #f3a712;
      color: #1f1b14;
      font-weight: 700;
      font-size: 1.6rem;
      box-shadow: 0 5px 0 #b4621a;
    }

    .btn-equal {
      background: #2b9c5c;
      color: white;
      font-size: 1.7rem;
      font-weight: bold;
      box-shadow: 0 5px 0 #166b3e;
    }

    .btn-clear {
      background: #c44536;
      color: white;
      box-shadow: 0 5px 0 #892e22;
    }

    .btn-sci {
      background: #3c2f5f;
      font-size: 1rem;
    }

    @media (max-width: 520px) {
      .calc-container {
        padding: 16px;
      }
      .buttons-grid {
        gap: 10px;
      }
      button {
        padding: 12px 0;
        font-size: 1.1rem;
      }
      .result {
        font-size: 2rem;
      }
      .expression {
        font-size: 1.1rem;
      }
      .btn-op {
        font-size: 1.4rem;
      }
    }

    footer {
      text-align: center;
      font-size: 0.7rem;
      color: #6a6f87;
      margin-top: 24px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<div class="calc-container">
  <div class="display-wrap">
    <div class="expression" id="expressionDisplay">0</div>
    <div class="result" id="resultDisplay">= 0</div>
  </div>

  <div class="buttons-grid" id="buttonPanel"></div>
  <footer>⚡ ZEWPOL SCIENTIFIC | trig, log, sqrt, π, e, constants | degree/rad toggle</footer>
</div>

<script>
  let currentExpression = "";
  let lastResult = null;
  let radianMode = true;
  let memory = 0;
  
  const expressionDiv = document.getElementById("expressionDisplay");
  const resultDiv = document.getElementById("resultDisplay");

  function updateDisplay() {
    if (currentExpression === "") {
      expressionDiv.innerText = "0";
    } else {
      expressionDiv.innerText = currentExpression;
    }
    if (lastResult !== null && lastResult !== undefined && !isNaN(lastResult) && isFinite(lastResult)) {
      let formatted = typeof lastResult === 'number' ? parseFloat(lastResult.toFixed(10)) : lastResult;
      if (formatted.toString().length > 20) {
        formatted = lastResult.toExponential(10);
      }
      resultDiv.innerText = `= ${formatted}`;
    } else if (lastResult === null) {
      resultDiv.innerText = "= 0";
    } else {
      resultDiv.innerText = "= Error";
    }
  }

  function evaluateExpression(expr) {
    if (!expr.trim()) return 0;
    
    let processed = expr.replace(/\^/g, '**');
    processed = processed.replace(/π/g, 'PI').replace(/e\b/g, 'E');
    processed = processed.replace(/pi\b/gi, 'PI');
    
    if (!radianMode) {
      const forwardTrig = ['sin', 'cos', 'tan'];
      for (let fn of forwardTrig) {
        const regex = new RegExp(`${fn}\\(([^)]+(?:\\([^)]*\\)[^)]*)*)\\)`, 'g');
        processed = processed.replace(regex, (match, inner) => {
          return `${fn}(${inner} * PI / 180)`;
        });
      }
      
      const inverseTrig = ['asin', 'acos', 'atan'];
      for (let fn of inverseTrig) {
        const regex = new RegExp(`${fn}\\(([^)]+(?:\\([^)]*\\)[^)]*)*)\\)`, 'g');
        processed = processed.replace(regex, (match, inner) => {
          return `(${fn}(${inner}) * 180 / PI)`;
        });
      }
    }
    
    const mathContext = {
      PI: Math.PI,
      E: Math.E,
      sin: (x) => Math.sin(x),
      cos: (x) => Math.cos(x),
      tan: (x) => Math.tan(x),
      asin: (x) => Math.asin(x),
      acos: (x) => Math.acos(x),
      atan: (x) => Math.atan(x),
      sinh: (x) => Math.sinh(x),
      cosh: (x) => Math.cosh(x),
      tanh: (x) => Math.tanh(x),
      ln: (x) => Math.log(x),
      log10: (x) => Math.log10(x),
      sqrt: (x) => Math.sqrt(x),
      abs: (x) => Math.abs(x),
      floor: (x) => Math.floor(x),
      ceil: (x) => Math.ceil(x),
      round: (x) => Math.round(x),
      exp: (x) => Math.exp(x),
      fact: (n) => { if (n < 0) return NaN; if (Math.floor(n) !== n) return NaN; let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
    };
    
    const keys = Object.keys(mathContext);
    const values = keys.map(k => mathContext[k]);
    
    try {
      const evaluator = new Function(...keys, `'use strict'; return (${processed});`);
      const result = evaluator(...values);
      if (typeof result !== 'number' || isNaN(result) || !isFinite(result)) {
        throw new Error("Invalid math result");
      }
      return result;
    } catch (err) {
      throw new Error("Expression error");
    }
  }
  
  function computeExpression() {
    if (currentExpression.trim() === "") {
      lastResult = 0;
      updateDisplay();
      return;
    }
    try {
      let exprToEval = currentExpression;
      exprToEval = exprToEval.replace(/(\d+(?:\.\d+)?|\))\!/g, (match, p1) => {
        return `fact(${p1})`;
      });
      exprToEval = exprToEval.replace(/\(([^()]*)\)\!/g, (match, inner) => `fact((${inner}))`);
      
      const result = evaluateExpression(exprToEval);
      lastResult = result;
      updateDisplay();
    } catch (err) {
      lastResult = NaN;
      resultDiv.innerText = "= Syntax Error";
      expressionDiv.innerText = currentExpression || "0";
    }
  }
  
  function appendToExpression(value) {
    if (currentExpression === "" && (value === '*' || value === '/' || value === '%' || value === '^' || value === ')' || value === '!')) {
      if (value !== '-' && value !== '(' && value !== '+') {
        return;
      }
    }
    currentExpression += value;
    updateDisplay();
  }
  
  function clearAll() {
    currentExpression = "";
    lastResult = null;
    updateDisplay();
  }
  
  function backspace() {
    currentExpression = currentExpression.slice(0, -1);
    updateDisplay();
  }
  
  function useAns() {
    if (lastResult !== null && !isNaN(lastResult) && isFinite(lastResult)) {
      appendToExpression(lastResult.toString());
    } else {
      appendToExpression("0");
    }
  }
  
  let degRadBtn;
  function toggleDegRad() {
    radianMode = !radianMode;
    if (degRadBtn) degRadBtn.innerText = radianMode ? "RAD" : "DEG";
  }
  
  function memRecall() { if (memory !== undefined) appendToExpression(memory.toString()); }
  function memStore() { if (lastResult !== null && !isNaN(lastResult) && isFinite(lastResult)) memory = lastResult; }
  function memClear() { memory = 0; }
  function memAdd() { if (lastResult !== null && !isNaN(lastResult) && isFinite(lastResult)) memory += lastResult; }
  
  const buttonPanel = document.getElementById("buttonPanel");
  
  const buttons = [
    { label: "(", action: () => appendToExpression("("), class: "btn-func" },
    { label: ")", action: () => appendToExpression(")"), class: "btn-func" },
    { label: "C", action: () => clearAll(), class: "btn-clear" },
    { label: "⌫", action: () => backspace(), class: "btn-clear" },
    { label: "÷", action: () => appendToExpression("/"), class: "btn-op" },
    
    { label: "7", action: () => appendToExpression("7"), class: "" },
    { label: "8", action: () => appendToExpression("8"), class: "" },
    { label: "9", action: () => appendToExpression("9"), class: "" },
    { label: "×", action: () => appendToExpression("*"), class: "btn-op" },
    { label: "√", action: () => appendToExpression("sqrt("), class: "btn-func" },
    
    { label: "4", action: () => appendToExpression("4"), class: "" },
    { label: "5", action: () => appendToExpression("5"), class: "" },
    { label: "6", action: () => appendToExpression("6"), class: "" },
    { label: "-", action: () => appendToExpression("-"), class: "btn-op" },
    { label: "^", action: () => appendToExpression("^"), class: "btn-func" },
    
    { label: "1", action: () => appendToExpression("1"), class: "" },
    { label: "2", action: () => appendToExpression("2"), class: "" },
    { label: "3", action: () => appendToExpression("3"), class: "" },
    { label: "+", action: () => appendToExpression("+"), class: "btn-op" },
    { label: "%", action: () => appendToExpression("%"), class: "btn-func" },
    
    { label: "0", action: () => appendToExpression("0"), class: "" },
    { label: ".", action: () => appendToExpression("."), class: "" },
    { label: "π", action: () => appendToExpression("π"), class: "btn-sci" },
    { label: "e", action: () => appendToExpression("e"), class: "btn-sci" },
    { label: "=", action: () => computeExpression(), class: "btn-equal" },
    
    { label: "sin", action: () => appendToExpression("sin("), class: "btn-sci" },
    { label: "cos", action: () => appendToExpression("cos("), class: "btn-sci" },
    { label: "tan", action: () => appendToExpression("tan("), class: "btn-sci" },
    { label: "ln", action: () => appendToExpression("ln("), class: "btn-sci" },
    { label: "log", action: () => appendToExpression("log10("), class: "btn-sci" },
    
    { label: "asin", action: () => appendToExpression("asin("), class: "btn-sci" },
    { label: "acos", action: () => appendToExpression("acos("), class: "btn-sci" },
    { label: "atan", action: () => appendToExpression("atan("), class: "btn-sci" },
    { label: "sinh", action: () => appendToExpression("sinh("), class: "btn-sci" },
    { label: "cosh", action: () => appendToExpression("cosh("), class: "btn-sci" },
    
    { label: "tanh", action: () => appendToExpression("tanh("), class: "btn-sci" },
    { label: "abs", action: () => appendToExpression("abs("), class: "btn-sci" },
    { label: "floor", action: () => appendToExpression("floor("), class: "btn-sci" },
    { label: "ceil", action: () => appendToExpression("ceil("), class: "btn-sci" },
    { label: "!", action: () => appendToExpression("!"), class: "btn-func" },
    
    { label: "Ans", action: () => useAns(), class: "btn-func" },
    { label: "MR", action: () => memRecall(), class: "btn-func" },
    { label: "MS", action: () => memStore(), class: "btn-func" },
    { label: "M+", action: () => memAdd(), class: "btn-func" },
    { label: "MC", action: () => memClear(), class: "btn-func" },
    
    { label: "RAD/DEG", action: () => toggleDegRad(), class: "btn-sci", id: "degRadToggle" },
    { label: "exp", action: () => appendToExpression("exp("), class: "btn-sci" },
    { label: "x²", action: () => appendToExpression("^2"), class: "btn-func" },
    { label: "x³", action: () => appendToExpression("^3"), class: "btn-func" },
    { label: "1/x", action: () => appendToExpression("^(-1)"), class: "btn-func" }
  ];
  
  function buildUI() {
    buttonPanel.innerHTML = "";
    buttons.forEach(btn => {
      const buttonEl = document.createElement("button");
      buttonEl.innerText = btn.label;
      if (btn.class) buttonEl.className = btn.class;
      else buttonEl.className = "";
      if (btn.id) buttonEl.id = btn.id;
      buttonEl.addEventListener("click", (e) => {
        e.preventDefault();
        btn.action();
      });
      buttonPanel.appendChild(buttonEl);
    });
    degRadBtn = document.getElementById("degRadToggle");
    if (degRadBtn) degRadBtn.innerText = radianMode ? "RAD" : "DEG";
  }
  
  buildUI();
  clearAll();
  updateDisplay();
  
  window.addEventListener('keydown', (e) => {
    const key = e.key;
    if (/[0-9\.\(\)\+\-\*\/\%]/.test(key)) {
      e.preventDefault();
      if (key === '*') appendToExpression('*');
      else if (key === '/') appendToExpression('/');
      else appendToExpression(key);
    } else if (key === 'Enter' || key === '=') {
      e.preventDefault();
      computeExpression();
    } else if (key === 'Escape') {
      clearAll();
    } else if (key === 'Backspace') {
      backspace();
    } else if (key === '^') {
      appendToExpression('^');
    } else if (key === '!') {
      appendToExpression('!');
    }
  });
</script>
</body>
</html>
